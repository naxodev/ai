name: Bug report
description: Report reproducible incorrect behavior in a package.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues before submitting a report. Remove secrets and private media or prompt information from logs.
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure the package...
        2. Start the host application...
        3. Reproduce the behavior...
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@naxodev/music-core"
        - "@naxodev/opencode-music-player"
        - "@naxodev/opencode-vim"
        - "@naxodev/pi-music-dock"
        - "@naxodev/apnea"
        - "@naxodev/pi-apnea"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: runtime-versions
    attributes:
      label: Host and runtime versions
      description: Include relevant `opencode2`, Pi, Bun, Node.js, Herdr, agent CLI, and VCS versions.
      placeholder: |
        opencode2: not applicable
        Pi: 0.84.0
        Bun: 1.3.7
        Node.js: 22.19.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Media backend
      options:
        - media-control
        - nowplaying-cli
        - Neither or unknown
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant redacted logs or terminal output.
      render: shell
