name: Feature request
description: Propose a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and alternatives considered.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@naxodev/music-core"
        - "@naxodev/opencode-music-player"
        - "@naxodev/opencode-vim"
        - "@naxodev/pi-music-dock"
        - "@naxodev/apnea"
        - "@naxodev/pi-apnea"
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Platform scope
      options:
        - label: This request is compatible with the selected package's platform scope.
          required: true
