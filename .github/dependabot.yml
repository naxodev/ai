version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      opencode-host:
        patterns:
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
