version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@nx/js"
        versions: ["23.3.0"]
      - dependency-name: "nx"
        versions: ["23.3.0"]
    groups:
      opencode-host:
        patterns:
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@opencode/*"
          - "@opentui/*"
          - "solid-js"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
