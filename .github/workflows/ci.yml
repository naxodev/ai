name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.head_ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Validate packages on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tested OpenCode CLI
        run: |
          OPENCODE_VERSION=$(node -p "require('./packages/opencode-vim/package.json').dependencies['@opencode-ai/plugin']")
          bun add --global --trust "@opencode-ai/cli@$OPENCODE_VERSION"

      - name: Install Neovim parity oracle
        run: brew install neovim

      - name: Install Neovim parity oracle
        run: brew install neovim

      - name: Check workspace formatting
        run: bun run format:check

      - name: Run cached package gates
        run: bunx nx run-many -t typecheck test parity format:check package:check smoke
