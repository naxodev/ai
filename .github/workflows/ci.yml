name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.head_ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  quality:
    name: Quality on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:check

      - name: Validate release policy
        if: matrix.os != 'windows-latest'
        run: bun run policy:check

      - name: Set affected revisions
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

      - name: Check workspace formatting
        run: bun run format:check

      - name: Build affected packages
        run: bunx nx affected -t build

      - name: Typecheck affected packages
        run: bunx nx affected -t typecheck

      - name: Test affected packages
        if: matrix.os != 'windows-latest'
        run: bunx nx affected -t test

      - name: Test affected Windows packages
        if: matrix.os == 'windows-latest'
        run: bunx nx affected -t test --exclude=apnea

      - name: Check affected package formatting
        run: bunx nx affected -t format:check

      - name: Validate affected package contents
        if: matrix.os != 'windows-latest'
        run: bunx nx affected -t package:check

      - name: Validate affected Windows package contents
        if: matrix.os == 'windows-latest'
        run: bunx nx affected -t package:check --exclude=apnea

  integration:
    name: Validate platform integrations on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tested OpenCode CLI
        run: |
          OPENCODE_VERSION=$(node -p "require('./packages/opencode-vim/package.json').dependencies['@opencode-ai/plugin']")
          bun add --global --trust "@opencode-ai/cli@$OPENCODE_VERSION"

      - name: Install TUI test dependencies
        run: brew install neovim tmux

      - name: Set affected revisions
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

      - name: Run affected parity gates
        run: bunx nx affected -t parity

      - name: Run affected package smokes
        run: bunx nx affected -t smoke --parallel=1
