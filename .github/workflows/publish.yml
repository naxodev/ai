name: Publish

on:
  push:
    tags:
      - "music-core@v*"
      - "opencode-music-player@v*"
      - "opencode-vim@v*"
      - "pi-music-dock@v*"
      - "apnea@v*"
      - "pi-apnea@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as opencode-music-player@v0.2.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish production package
    runs-on: macos-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: publish-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^(apnea|music-core|opencode-music-player|opencode-vim|pi-apnea|pi-music-dock)@v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            PROJECT="${BASH_REMATCH[1]}"
            VERSION="${RELEASE_TAG#*@v}"
          else
            echo "::error::Expected a known project@vX.Y.Z release tag"
            exit 1
          fi

          case "$PROJECT" in
            apnea) PACKAGE='@naxodev/apnea' ;;
            music-core) PACKAGE='@naxodev/music-core' ;;
            opencode-music-player) PACKAGE='@naxodev/opencode-music-player' ;;
            opencode-vim) PACKAGE='@naxodev/opencode-vim' ;;
            pi-apnea) PACKAGE='@naxodev/pi-apnea' ;;
            pi-music-dock) PACKAGE='@naxodev/pi-music-dock' ;;
            *) echo "::error::Unmapped project '$PROJECT'"; exit 1 ;;
          esac

          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac

          {
            echo "tag=$RELEASE_TAG"
            echo "project=$PROJECT"
            echo "package=$PACKAGE"
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # Do not set registry-url. It creates an auth-token entry that breaks tokenless OIDC publishing.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tested OpenCode CLI
        if: startsWith(steps.release.outputs.project, 'opencode-')
        env:
          PROJECT: ${{ steps.release.outputs.project }}
        run: |
          OPENCODE_VERSION=$(node -p "require('./packages/$PROJECT/package.json').dependencies['@opencode-ai/plugin']")
          bun add --global --trust "@opencode-ai/cli@$OPENCODE_VERSION"

      - name: Install TUI test dependencies
        if: startsWith(steps.release.outputs.project, 'opencode-')
        run: brew install tmux

      - name: Install Neovim parity oracle
        if: steps.release.outputs.project == 'opencode-vim'
        run: brew install neovim

      - name: Verify package name and version
        env:
          EXPECTED_NAME: ${{ steps.release.outputs.package }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          PROJECT: ${{ steps.release.outputs.project }}
        run: |
          ACTUAL_NAME=$(node -p "require('./packages/$PROJECT/package.json').name")
          ACTUAL_VERSION=$(node -p "require('./packages/$PROJECT/package.json').version")
          if [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ] || [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tag expects $EXPECTED_NAME@$EXPECTED_VERSION but manifest contains $ACTUAL_NAME@$ACTUAL_VERSION"
            exit 1
          fi

      - name: Check whether version is already published
        id: published
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "::notice::$PACKAGE@$VERSION is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run package release gates
        if: steps.published.outputs.skip != 'true'
        run: bunx nx run-many -t typecheck test parity format:check package:check smoke --projects=${{ steps.release.outputs.project }}

      - name: Verify compatible Apnea core is published
        if: steps.published.outputs.skip != 'true' && steps.release.outputs.project == 'pi-apnea'
        run: bun run --cwd packages/pi-apnea prepublish:core

      - name: Publish source package with OIDC and provenance
        if: steps.published.outputs.skip != 'true'
        run: npm publish "packages/${{ steps.release.outputs.project }}" --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Verify registry publication
        if: steps.published.outputs.skip != 'true'
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "$PACKAGE@$VERSION is live"
              exit 0
            fi
            echo "$PACKAGE@$VERSION is not visible yet (attempt $attempt/5)"
            sleep 5
          done
          echo "::error::$PACKAGE@$VERSION is not visible on npm"
          exit 1
